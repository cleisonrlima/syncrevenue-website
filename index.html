<!doctype html>
<!--
  Story 7.1 (AC 3): static `<html class="dark">` forces dark mode site-wide
  from the FIRST paint, with zero FOUC risk.

  Rationale (see story Dev Notes reconciliation #4):
    - Programmatic `document.documentElement.classList.add('dark')` in
      `src/main.tsx` would mean the prerendered HTML (Story 5.6
      `scripts/prerender.tsx`) emits `<html lang="en">` (no `dark`), the
      browser paints the light-theme background for one frame, and only
      after hydration does the `dark` class land — visible FOUC.
    - Static class in `index.html` is copied verbatim by Vite into
      `dist/client/index.html`. The prerender script reads that file
      unchanged, so the `dark` class survives into the prerendered output
      and matches the post-hydration DOM (no hydration mismatch).
    - Epic 7 decision 2 locks the theme to dark (no OS-theme follow, no
      toggle) so a static class is the simplest correct option.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-host Plus Jakarta Sans + preload the woff2. The @font-face uses
         font-display: optional so throttled mobile Lighthouse does not move
         the text LCP event to a late font swap. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans.woff2"
      media="(min-width: 769px)"
      crossorigin
    />
    <title>SyncRevenue Commission Recovery | Sync Sirius</title>
    <meta
      name="description"
      content="Recover travel agency commission revenue lost to GDS discrepancies, debit memo disputes, and BSP/ARC reconciliation gaps."
    />
    <meta property="og:title" content="SyncRevenue Commission Recovery | Sync Sirius" />
    <meta
      property="og:description"
      content="Recover travel agency commission revenue lost to GDS discrepancies, debit memo disputes, and BSP/ARC reconciliation gaps."
    />
    <meta property="og:image" content="https://syncsirius.com/og-default.png" />
    <meta property="og:url" content="https://syncsirius.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <link rel="canonical" href="https://syncsirius.com/" />
    <!-- Story 6.13 (AC 7) — preload the same hero LCP image variant that
         the rendered <picture> selects for each media query. Split preloads
         avoid high-DPR mobile fetching the desktop asset before rendering the
         mobile source. fetchpriority=high signals high priority. -->
    <link
      rel="preload"
      as="image"
      href="/hero/airplane-mobile.webp"
      media="(max-width: 768px)"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero/airplane.webp"
      media="(min-width: 769px)"
      type="image/webp"
      fetchpriority="high"
    />
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
