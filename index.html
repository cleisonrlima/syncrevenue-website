<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Story 6.13 (AC 6): self-host Plus Jakarta Sans + preload the woff2.
         Replaces the Google Fonts CDN round-trip and the post-paint font
         swap that was the dominant desktop CLS contributor (0.184 on `/`). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans.woff2"
      crossorigin
    />
    <title>SyncRevenue Commission Recovery | Sync Sirius</title>
    <meta
      name="description"
      content="Recover travel agency commission revenue lost to GDS discrepancies, debit memo disputes, and BSP/ARC reconciliation gaps."
    />
    <meta property="og:title" content="SyncRevenue Commission Recovery | Sync Sirius" />
    <meta
      property="og:description"
      content="Recover travel agency commission revenue lost to GDS discrepancies, debit memo disputes, and BSP/ARC reconciliation gaps."
    />
    <meta property="og:image" content="https://syncsirius.com/og-default.png" />
    <meta property="og:url" content="https://syncsirius.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <link rel="canonical" href="https://syncsirius.com/" />
    <!-- Story 6.13 (AC 7) — preload the same hero LCP image variant that
         the rendered <picture> selects for each media query. Split preloads
         avoid high-DPR mobile fetching the desktop asset before rendering the
         mobile source. fetchpriority=high signals high priority. -->
    <link
      rel="preload"
      as="image"
      href="/hero/airplane-mobile.webp"
      media="(max-width: 768px)"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero/airplane.webp"
      media="(min-width: 769px)"
      type="image/webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
