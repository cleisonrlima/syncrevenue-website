name: Quality

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:run
      - run: npm run test:coverage
      - run: npm run check:contrast
      - name: Run backup script tests
        run: npm run test:backup

  e2e:
    name: Playwright e2e + axe
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 35
    env:
      PORT: '3001'
      DB_PATH: '../data/sync_sirius-ci-e2e.db'
      JWT_SECRET: 'ci-e2e-jwt-secret-0000000000000000'
      SMTP_HOST: 'localhost'
      SMTP_PORT: '1025'
      SMTP_USER: 'ci'
      SMTP_PASS: 'ci'
      NOTIFY_EMAIL: 'ci@example.com'
      ALLOWED_ORIGIN: 'http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-smoke:
    name: Build artifact smoke test
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Assert prerender output integrity
        run: npm run test:build
      - name: Scan client bundle for secrets
        run: npm run check:client-bundle-secrets

  lighthouse:
    name: Lighthouse CI (desktop + mobile)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lighthouse CI desktop
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Lighthouse CI mobile
        run: npm run lhci:mobile
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
